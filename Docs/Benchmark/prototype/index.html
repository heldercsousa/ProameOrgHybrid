<!doctype html>
<html lang="pt-BR" data-theme="light" data-palette="b">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Protótipo navegável do app do PROAME – Projeto Amor e Esperança, Gama (DF).">
  <meta name="theme-color" content="#1b2a07">
  <title>PROAME – Protótipo</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/logo/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="PROAME – Protótipo">
  <meta property="og:description" content="Protótipo navegável do app do PROAME – Projeto Amor e Esperança, Gama (DF).">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/logo/og-image.png">
  <!-- Roboto = MudBlazor default typeface. Falls back to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved/OS colour scheme and palette (A/B/C) before first paint.
    // Palette precedence: ?tema=a|b|c URL param, then the saved choice, then B (logo-derived default).
    (function () {
      var palettes = ['a', 'b', 'c'];
      var t = localStorage.getItem('proame-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      var fromUrl = new URLSearchParams(location.search).get('tema');
      var p = palettes.indexOf(fromUrl) >= 0 ? fromUrl : localStorage.getItem('proame-palette');
      if (palettes.indexOf(p) < 0) { p = 'b'; }
      document.documentElement.setAttribute('data-palette', p);
    })();
  </script>
</head>
<body>
  <div id="app">
    <noscript><p class="container section">Este protótipo precisa de JavaScript habilitado.</p></noscript>
  </div>

  <div class="fab-dock">
    <button type="button" class="device-toggle theme-toggle" aria-label="Alternar tema claro/escuro"
      onclick="var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('proame-theme',n);">◐ Tema</button>
    <div class="palette-switch" role="group" aria-label="Paleta de cores">
      <button type="button" class="device-toggle" data-action="palette" data-value="a" aria-pressed="false" aria-label="Paleta A — cor original da marca">A</button>
      <button type="button" class="device-toggle" data-action="palette" data-value="b" aria-pressed="false" aria-label="Paleta B — extraída do novo logotipo">B</button>
      <button type="button" class="device-toggle" data-action="palette" data-value="c" aria-pressed="false" aria-label="Paleta C — verde do logotipo com cores mais vivas">C</button>
    </div>
    <button type="button" class="device-toggle" data-action="toggle-phone" aria-pressed="false">Celular / Desktop</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="dialog-root" class="dialog-root" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
