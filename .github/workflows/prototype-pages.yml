# Publishes the clickable prototype (Docs/Benchmark/prototype) to GitHub Pages so
# stakeholders can open it from a single link: https://heldercsousa.github.io/ProameOrgHybrid/
# One-time setup: Settings > Pages > Source = "GitHub Actions";
# Settings > Environments > github-pages > allow branch "develop".
name: Prototype - GitHub Pages

on:
  push:
    branches: [develop, main]
    paths:
      - "Docs/Benchmark/prototype/**"
      - ".github/workflows/prototype-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Docs/Benchmark/prototype
      - id: deployment
        uses: actions/deploy-pages@v5
